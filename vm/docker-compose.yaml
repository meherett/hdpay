# HDPay: the api, the web app (the admin), one watcher and one sweeper per chain, and (optionally) MongoDB and the
# example shop. Run every command below from vm/ (or add -f vm/docker-compose.yaml); the code, envs/ and
# chains.yaml are one level up.
#
#   docker compose up -d --build                 api, web, watchers, sweepers (MongoDB from envs/common.env, e.g. Atlas)
#   docker compose --profile mongo up -d         also run MongoDB here; set HDPAY_MONGODB_URI=mongodb://mongo:27017
#   docker compose --profile example up -d       also the example shop: its API (8400) and checkout (4400)
#   docker compose logs -f watcher-tron-nile
#
# The images are on GitHub's registry (private: docker login ghcr.io first, with a token that can read packages):
#   docker compose --profile example pull        a server takes the published images, nothing is built
#   docker compose --profile example up -d       and runs them
#   docker compose --profile example build       here: build them under the same names (or up -d --build)
#   docker compose --profile example push        and publish them to ghcr.io/meherett (needs write:packages)
#
# The web app is at http://localhost:4500 and reaches the api through its own /api/, so it needs no CORS.
# On the VM, the nginx service (profile nginx) serves them as hdpay.systems, api.hdpay.systems and
# example.hdpay.systems on 80 and 443, with the certificate in vm/ssl/; the other ports listen on
# 127.0.0.1 only. vm/.env can switch the profiles on: COMPOSE_PROFILES=example,nginx
# The example shop's settings are in envs/example.env (HDPAY_SECRET_KEY, SMTP_...); its users are
# seeded with: docker compose run --rm example-api python -m source.users seed
#
# One-off tools, in a throwaway container:
#   docker compose run --rm api python -m api.manage create-admin --email you@example.com --name "Your Name"
#   docker compose run --rm sweeper-tron-nile python -m api.keys project <number>
#
# Settings come from ../envs/: common.env (every service) and sweeper.env (the master key: the sweepers
# only, never the api).
# ../chains.yaml is mounted read-only, so edits apply without a rebuild or restart.
#
# Every chain in chains.yaml has a watcher and a sweeper below; for a new chain, copy a pair and change
# the chain key.

name: hdpay

x-service: &service
  restart: unless-stopped
  env_file: ../envs/common.env
  environment:
    HDPAY_RELOAD: "false"
    HDPAY_CHAINS_FILE: /hdpay/chains.yaml
  volumes:
    - ../chains.yaml:/hdpay/chains.yaml:ro
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-watcher: &watcher
  <<: *service
  build: { context: .., target: watcher }
  image: ghcr.io/meherett/hdpay-watcher:latest

x-sweeper: &sweeper
  <<: *service
  build: { context: .., target: sweeper }
  image: ghcr.io/meherett/hdpay-sweeper:latest
  env_file:
    - ../envs/common.env
    - path: ../envs/sweeper.env
      required: false   # without it the sweeper stops at once, saying HDPAY_MASTER_XPRV is missing

services:
  api:
    <<: *service
    build: { context: .., target: api }
    image: ghcr.io/meherett/hdpay-api:latest
    ports:
      - "127.0.0.1:8090:8090"   # only nginx on the VM reaches it (nginx/sites-available)
    environment:
      HDPAY_RELOAD: "false"
      HDPAY_CHAINS_FILE: /hdpay/chains.yaml
      HDPAY_PORT: "8090"
      # who may pass on the caller's IP: the web app's nginx and the nginx service (below), at their fixed
      # addresses; anyone else's X-Forwarded-For is ignored
      HDPAY_FORWARDED_ALLOW_IPS: 172.28.0.10,172.28.0.11
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ../web
    image: ghcr.io/meherett/hdpay-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:4500:80"
    environment:
      HDPAY_API_URL: http://api:8090
    networks:
      default:
        ipv4_address: 172.28.0.10   # trusted by the api for X-Forwarded-For
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # The way in, on the VM: hdpay.systems, api.hdpay.systems and example.hdpay.systems over HTTPS, routed
  # to the services by name (nginx/sites-available/hdpay-systems.conf). Off by default (--profile nginx,
  # or COMPOSE_PROFILES in vm/.env): it needs the certificate in vm/ssl/.
  nginx:
    image: nginx:1.29-alpine
    profiles: ["nginx"]
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sites-available:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      default:
        ipv4_address: 172.28.0.11   # trusted by the api for X-Forwarded-For
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # One watcher and one sweeper per chain in chains.yaml
#  watcher-ethereum:
#    <<: *watcher
#    command: ["python", "-m", "watcher", "--chain", "ethereum"]

#  watcher-sepolia:
#    <<: *watcher
#    command: ["python", "-m", "watcher", "--chain", "sepolia"]

#  watcher-bsc:
#    <<: *watcher
#    command: ["python", "-m", "watcher", "--chain", "bsc"]

  watcher-bsc-testnet:
    <<: *watcher
    command: ["python", "-m", "watcher", "--chain", "bsc-testnet"]

#  watcher-tron:
#    <<: *watcher
#    command: ["python", "-m", "watcher", "--chain", "tron"]

  watcher-tron-nile:
    <<: *watcher
    command: ["python", "-m", "watcher", "--chain", "tron-nile"]

#  sweeper-ethereum:
#    <<: *sweeper
#    command: ["python", "-m", "sweeper", "--chain", "ethereum"]

#  sweeper-sepolia:
#    <<: *sweeper
#    command: ["python", "-m", "sweeper", "--chain", "sepolia"]

#  sweeper-bsc:
#    <<: *sweeper
#    command: ["python", "-m", "sweeper", "--chain", "bsc"]

  sweeper-bsc-testnet:
    <<: *sweeper
    command: ["python", "-m", "sweeper", "--chain", "bsc-testnet"]

#  sweeper-tron:
#    <<: *sweeper
#    command: ["python", "-m", "sweeper", "--chain", "tron"]

  sweeper-tron-nile:
    <<: *sweeper
    command: ["python", "-m", "sweeper", "--chain", "tron-nile"]

  # The example shop, off by default: --profile example.
  example-api:
    build: ../example/api
    image: ghcr.io/meherett/hdpay-example-api:latest
    profiles: ["example"]
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - path: ../envs/example.env
        required: false   # without HDPAY_SECRET_KEY the shop starts but takes no orders
    environment:
      HDPAY_URL: http://api:8090
      # the checkout's address, for the links in the shop's emails: https://example.hdpay.systems on the VM (vm/.env)
      WEB_URL: ${EXAMPLE_WEB_URL:-http://localhost:4400}
    ports:
      - "127.0.0.1:8400:8400"
    volumes:
      - example-data:/data

  example-web:
    build: ../example/web
    image: ghcr.io/meherett/hdpay-example-web:latest
    profiles: ["example"]
    restart: unless-stopped
    depends_on:
      - example-api
    ports:
      - "127.0.0.1:4400:80"
    environment:
      EXAMPLE_API_URL: http://example-api:8400

  # Off by default: Atlas is used for now. Start it with --profile mongo.
  mongo:
    image: mongo:8
    profiles: ["mongo"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          # automatic addresses come from here, so the fixed ones (web 172.28.0.10, nginx 172.28.0.11)
          # are never taken first
          ip_range: 172.28.1.0/24
          gateway: 172.28.0.1

volumes:
  mongo-data:
  example-data:
