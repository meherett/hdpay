# HDPay nginx configuration: hdpay.systems, api.hdpay.systems and example.hdpay.systems
#
# The nginx service in docker-compose.yaml (profile nginx) mounts this folder as /etc/nginx/conf.d and
# reaches the other services by name, on the compose network:
#
#   hdpay.systems              -> web          (web:80)
#   hdpay.systems/api/...      -> api          (api:8090), without the /api prefix
#   api.hdpay.systems          -> api          (api:8090)
#   example.hdpay.systems      -> example-web  (example-web:80)
#   example.hdpay.systems/api/ -> example-api  (example-api:8400), without the /api prefix
#
# Behind Cloudflare, with one certificate for hdpay.systems and *.hdpay.systems in vm/ssl/ (never
# committed), mounted as /etc/nginx/ssl.

# Cloudflare's addresses (https://www.cloudflare.com/ips/): only a request from them may say who the
# visitor is, in CF-Connecting-IP; $remote_addr is then the visitor, and that is what the apps are told
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# the services are looked up by name when a request comes (Docker's DNS), not when nginx starts, so
# nginx starts even while one of them is not running (the example shop is a profile of its own)
resolver 127.0.0.11 valid=10s ipv6=off;

# the API's event stream is a WebSocket: pass the upgrade on when there is one
map $http_upgrade $hdpay_connection {
    default upgrade;
    ''      '';
}

server {

    listen 80;
    server_name hdpay.systems api.hdpay.systems example.hdpay.systems;
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    http2 on;
    server_name hdpay.systems;

    ssl_certificate /etc/nginx/ssl/certs/hdpay-systems/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/private/hdpay-systems/private.key;

    set $hdpay_web http://web:80;
    set $hdpay_api http://api:8090;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $hdpay_web;
    }

    # /api/admin/... reaches the API as /admin/...
    location /api/ {

        rewrite ^/api/(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hdpay_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;

        proxy_pass $hdpay_api;
    }
}

server {

    listen 443 ssl;
    http2 on;
    server_name api.hdpay.systems;

    ssl_certificate /etc/nginx/ssl/certs/hdpay-systems/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/private/hdpay-systems/private.key;

    set $hdpay_api http://api:8090;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hdpay_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the event stream stays open; nginx would otherwise close it after a minute of quiet
        proxy_read_timeout 3600s;

        proxy_pass $hdpay_api;
    }
}

server {

    listen 443 ssl;
    http2 on;
    server_name example.hdpay.systems;

    ssl_certificate /etc/nginx/ssl/certs/hdpay-systems/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/private/hdpay-systems/private.key;

    set $example_web http://example-web:80;
    set $example_api http://example-api:8400;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $example_web;
    }

    location /api/ {

        rewrite ^/api/(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $example_api;
    }
}
