# HDPay nginx configuration: hdpay.systems, api.hdpay.systems and example.hdpay.systems
#
#   hdpay.systems              -> hdpay-web          (127.0.0.1:4500)
#   hdpay.systems/api/...      -> hdpay-api          (127.0.0.1:8090), without the /api prefix
#   api.hdpay.systems          -> hdpay-api          (127.0.0.1:8090)
#   example.hdpay.systems      -> hdpay-example-web  (127.0.0.1:4400)
#   example.hdpay.systems/api/ -> hdpay-example-api  (127.0.0.1:8400), without the /api prefix
#
# Behind Cloudflare, with one origin certificate for hdpay.systems and *.hdpay.systems, copied from
# vm/ssl/ to /etc/ssl/ on the VM (vm/ssl/ is not committed).

# Cloudflare's addresses (https://www.cloudflare.com/ips/): only a request from them may say who the
# visitor is, in CF-Connecting-IP; $remote_addr is then the visitor, and that is what the apps are told
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# the API's event stream is a WebSocket: pass the upgrade on when there is one
map $http_upgrade $hdpay_connection {
    default upgrade;
    ''      '';
}

upstream hdpay-systems-web {

    server 127.0.0.1:4500;
    keepalive 32;
}

upstream hdpay-systems-api {

    server 127.0.0.1:8090;
    keepalive 32;
}

upstream hdpay-systems-example-web {

    server 127.0.0.1:4400;
    keepalive 32;
}

upstream hdpay-systems-example-api {

    server 127.0.0.1:8400;
    keepalive 32;
}

server {

    listen 80;
    server_name hdpay.systems api.hdpay.systems example.hdpay.systems;
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl http2;
    server_name hdpay.systems;

    ssl_certificate /etc/ssl/certs/hdpay-systems/origin.crt;
    ssl_certificate_key /etc/ssl/private/hdpay-systems/private.key;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://hdpay-systems-web;
    }

    # the trailing slashes drop the /api prefix: /api/admin/... reaches the API as /admin/...
    location /api/ {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hdpay_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;

        proxy_pass http://hdpay-systems-api/;
    }
}

server {

    listen 443 ssl http2;
    server_name api.hdpay.systems;

    ssl_certificate /etc/ssl/certs/hdpay-systems/origin.crt;
    ssl_certificate_key /etc/ssl/private/hdpay-systems/private.key;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hdpay_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the event stream stays open; nginx would otherwise close it after a minute of quiet
        proxy_read_timeout 3600s;

        proxy_pass http://hdpay-systems-api;
    }
}

server {

    listen 443 ssl http2;
    server_name example.hdpay.systems;

    ssl_certificate /etc/ssl/certs/hdpay-systems/origin.crt;
    ssl_certificate_key /etc/ssl/private/hdpay-systems/private.key;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://hdpay-systems-example-web;
    }

    location /api/ {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://hdpay-systems-example-api/;
    }
}
