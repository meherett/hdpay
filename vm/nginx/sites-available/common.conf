# Settings every HDPay site shares, once for all of them: nginx reads every file in this folder into
# one configuration, and allows these only once. The sites themselves,
# their server blocks only, are in hdpay-systems.conf and hdpay-net.conf.

# Cloudflare's addresses (https://www.cloudflare.com/ips/): only a request from them may say who the
# visitor is, in CF-Connecting-IP; $remote_addr is then the visitor, and that is what the apps are told
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# the services are looked up by name when a request comes (Docker's DNS), not when nginx starts, so
# nginx starts even while one of them is not running (the example shop is a profile of its own)
resolver 127.0.0.11 valid=10s ipv6=off;

# the API's event stream is a WebSocket: pass the upgrade on when there is one
map $http_upgrade $hdpay_connection {
    default upgrade;
    ''      '';
}
