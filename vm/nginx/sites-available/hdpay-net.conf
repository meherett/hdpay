# HDPay nginx configuration: hdpay.net, api.hdpay.net and example.hdpay.net
#
# The nginx service in docker-compose.yaml (profile nginx) mounts this folder as /etc/nginx/conf.d and
# reaches the other services by name, on the compose network:
#
#   hdpay.net              -> web          (web:80)
#   hdpay.net/api/...      -> api          (api:8090), without the /api prefix
#   api.hdpay.net          -> api          (api:8090)
#   example.hdpay.net      -> example-web  (example-web:80)
#   example.hdpay.net/api/ -> example-api  (example-api:8400), without the /api prefix
#
# Behind Cloudflare, with one certificate for hdpay.net and *.hdpay.net in vm/ssl/ (never
# committed), mounted as /etc/nginx/ssl.

# Cloudflare's addresses, the resolver and the WebSocket map are in common.conf, shared by every
# site: nginx allows them only once.

server {

    listen 80;
    server_name hdpay.net api.hdpay.net example.hdpay.net;
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    http2 on;
    server_name hdpay.net;

    ssl_certificate /etc/nginx/ssl/certs/hdpay-net/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/private/hdpay-net/private.key;

    set $hdpay_web http://web:80;
    set $hdpay_api http://api:8090;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $hdpay_web;
    }

    # /api/admin/... reaches the API as /admin/...
    location /api/ {

        rewrite ^/api/(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hdpay_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;

        proxy_pass $hdpay_api;
    }
}

server {

    listen 443 ssl;
    http2 on;
    server_name api.hdpay.net;

    ssl_certificate /etc/nginx/ssl/certs/hdpay-net/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/private/hdpay-net/private.key;

    set $hdpay_api http://api:8090;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hdpay_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the event stream stays open; nginx would otherwise close it after a minute of quiet
        proxy_read_timeout 3600s;

        proxy_pass $hdpay_api;
    }
}

server {

    listen 443 ssl;
    http2 on;
    server_name example.hdpay.net;

    ssl_certificate /etc/nginx/ssl/certs/hdpay-net/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/private/hdpay-net/private.key;

    set $example_web http://example-web:80;
    set $example_api http://example-api:8400;

    location / {

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $example_web;
    }

    location /api/ {

        rewrite ^/api/(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $example_api;
    }
}
