<nz-card nzHoverable class="auth-card">
  <h1 class="auth-title">Admin sign in</h1>
  <p class="auth-subtitle">Sign in with your HDPay admin account.</p>

  @if (alert(); as currentAlert) {
    <nz-alert
      class="auth-alert"
      nzShowIcon
      nzCloseable
      [nzType]="currentAlert.type"
      [nzMessage]="currentAlert.message"
      (nzOnClose)="alert.set(null)" />
  }

  <form nz-form [formGroup]="formGroup" nzLayout="vertical" (ngSubmit)="login()">
    <nz-form-item>
      <nz-form-label nzFor="email">Email</nz-form-label>
      <nz-form-control [nzErrorTip]="emailError">
        <nz-input-wrapper>
          <nz-icon nzInputPrefix nzType="user" />
          <input nz-input id="email" type="email" formControlName="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="name@example.com" />
        </nz-input-wrapper>
        <ng-template #emailError let-control>
          @if (control.errors?.['required']) {
            Email is required
          }
          @if (control.errors?.['email']) {
            Enter a valid email address
          }
        </ng-template>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzFor="password">Password</nz-form-label>
      <nz-form-control nzErrorTip="Password is required">
        <nz-input-password>
          <nz-icon nzInputPrefix nzType="key" />
          <input nz-input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
        </nz-input-password>
      </nz-form-control>
    </nz-form-item>

    <button nz-button nzType="primary" nzBlock nzSize="large" type="submit" [nzLoading]="loading()">
      Sign in
    </button>
  </form>

  <p class="auth-foot">Forgot your password? Ask an admin to set a new one.</p>
</nz-card>
